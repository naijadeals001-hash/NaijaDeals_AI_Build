<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-label="Original NaijaDeals artwork: a bowl of Nigerian jollof rice with plantain and steam on a warm table">
  <defs>
