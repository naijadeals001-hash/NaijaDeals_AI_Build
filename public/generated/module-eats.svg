      <linearGradient id="rice" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fb923c"/><stop offset="0.55" stop-color="#ea580c"/><stop offset="1" stop-color="#b91c1c"/></linearGradient>
  </defs>
