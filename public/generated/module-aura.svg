      <circle cx="42" cy="37" r="6" fill="#6366f1"/><circle cx="70" cy="37" r="6" fill="#6366f1" opacity="0.7"/><circle cx="98" cy="37" r="6" fill="#6366f1" opacity="0.4"/>
