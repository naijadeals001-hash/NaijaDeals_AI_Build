      <radialGradient id="vinyl" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#f9a8d4"/><stop offset="0.2" stop-color="#a21caf"/><stop offset="0.6" stop-color="#1e1b4b"/><stop offset="1" stop-color="#0b0616"/></radialGradient>
  </defs>
