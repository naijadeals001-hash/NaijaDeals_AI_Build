  <path d="M0 430 q200 -70 400 -18 t400 -12 v200 H0z" fill="#ffffff" opacity="0.10"/>
  <ellipse cx="400" cy="486" rx="250" ry="44" fill="#0b1220" opacity="0.20" filter="url(#blur)"/>
