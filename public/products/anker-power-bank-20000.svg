<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Original NaijaDeals studio illustration of a black power bank with charge lights">
  <defs>
    <linearGradient id="stage" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#f5f3ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#c4b5fd" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#c4b5fd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="product" x1="0" y1="0" x2="0.6" y2="1">
