      <path d="M316 166 h168 l-14 162 q-2 18 -22 18 h-96 q-20 0 -22 -18z" fill="#f8fafc"/>
      <path d="M334 240 q66 -30 132 0 l-6 66 q-60 -26 -120 0z" fill="#f97316" opacity="0.75"/>
