global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    environment: local-dev
    service: naijadeals

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The Next.js application exposes /api/metrics behind a bearer token.
  # Docker Desktop resolves host.docker.internal to the Windows host.
  - job_name: naijadeals-app
    metrics_path: /api/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics-token
    static_configs:
      - targets: ["host.docker.internal:3015"]
        labels:
          app: naijadeals-web

  # Infrastructure exporters that ship with each engine's own HTTP API are not
  # scraped directly; only Prometheus-format endpoints are listed here.
