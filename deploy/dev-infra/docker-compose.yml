# NaijaDeals local development infrastructure
#
# Every image is pinned to an exact tag. Every host port binds to 127.0.0.1 so
# nothing on the LAN can reach a development service. Secrets come from
# deploy/dev-infra/.env, which is generated by gen-secrets.mjs and is gitignored.
#
# This file must never be used for production: no TLS, single-node storage,
# development credentials, and no backup policy.

name: naijadeals-infra

services:
  # ---------------------------------------------------------------------------
  # Valkey 9.1.3 (BSD-3-Clause) — cache + BullMQ backend.
  # The password is passed through a mounted config file rather than a command
  # argument so it does not appear in `docker inspect` output.
  # ---------------------------------------------------------------------------
  valkey:
    image: valkey/valkey:9.1.3-alpine
    container_name: nd-valkey
    command: ["valkey-server", "/usr/local/etc/valkey/valkey.conf"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - nd_valkey_data:/data
      - ./.runtime/valkey.conf:/usr/local/etc/valkey/valkey.conf:ro
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Meilisearch 1.56.2 (MIT core) — catalogue search.
  # ---------------------------------------------------------------------------
  meilisearch:
    image: getmeili/meilisearch:v1.56.2
    container_name: nd-meilisearch
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
      MEILI_HTTP_ADDR: 0.0.0.0:7700
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - nd_meili_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # SeaweedFS 4.53 (Apache-2.0) — S3-compatible object storage.
  # MinIO was rejected: archived upstream, AGPL-3.0, paid successor.
  # Only the S3 API is published; master/volume/filer stay on the compose
  # network, which is exactly the surface the 2026-11-09 advisories attack.
  # ---------------------------------------------------------------------------
  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    container_name: nd-seaweedfs
    command: >
      server
      -dir=/data
      -ip=seaweedfs
      -ip.bind=0.0.0.0
      -master.port=19333
      -volume.port=19334
      -filer
      -filer.port=18888
      -s3
      -s3.port=8333
      -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "127.0.0.1:9002:8333"
    volumes:
      - nd_seaweed_data:/data
      - ./.runtime/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8333/status"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # pgvector 0.8.7 on PostgreSQL 18 — vectors for Aura retrieval.
  # Separate instance because the native Windows PostgreSQL 18 has no `vector`
  # extension. This database holds embeddings only and never the ledger.
  # ---------------------------------------------------------------------------
  pgvector:
    image: pgvector/pgvector:0.8.7-pg18
    container_name: nd-pgvector
    environment:
      POSTGRES_DB: naijadeals_vectors
      POSTGRES_USER: nd_vector
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      # PostgreSQL 18 images require the mount one level up; mounting
      # /var/lib/postgresql/data is rejected as an unused volume.
      - nd_pgvector_data:/var/lib/postgresql
      - ./pgvector/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nd_vector -d naijadeals_vectors"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Prometheus 3.16.0 (Apache-2.0) — metrics store.
  # Remote read/write and the admin API are not enabled.
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: nd-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      # The lifecycle and admin APIs stay at their defaults (disabled). Passing
      # `=false` here is rejected by Prometheus' flag parser.
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./.runtime/metrics-token:/etc/prometheus/secrets/metrics-token:ro
      - nd_prom_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Grafana 13.3.0 (AGPL-3.0, flagged) — dashboards over Prometheus.
  # Not modified, not redistributed, internal self-host. Anonymous access and
  # sign-up are disabled; analytics and update checks are off.
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:13.3.0
    container_name: nd-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_INSTALL_PLUGINS: ""
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - nd_grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # OSRM 26.11.0 (BSD-2-Clause) — road routing for NaijaDrive / NaijaSend.
  # Runs only under the `routing` profile because it needs a prepared dataset:
  #   docker compose --profile routing run --rm osrm-prep osrm-extract -p /opt/car.lua /data/nigeria-latest.osm.pbf
  #   docker compose --profile routing run --rm osrm-prep osrm-partition /data/nigeria-latest.osrm
  #   docker compose --profile routing run --rm osrm-prep osrm-customize /data/nigeria-latest.osrm
  #   docker compose --profile routing up -d osrm
  # ---------------------------------------------------------------------------
  osrm-prep:
    image: ghcr.io/project-osrm/osrm-backend:26.11.0-amd64-debian
    profiles: ["routing"]
    working_dir: /data
    volumes:
      - ./osrm-data:/data

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:26.11.0-amd64-debian
    container_name: nd-osrm
    profiles: ["routing"]
    # OSRM 26.x takes the dataset base path, without the `.osrm` suffix.
    command: ["osrm-routed", "--algorithm", "mld", "--max-table-size", "10000", "/data/nigeria-latest"]
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./osrm-data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://localhost:5000/route/v1/driving/3.3792,6.5244;3.3515,6.6018?overview=false' | grep -q '\"code\":\"Ok\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  nd_valkey_data:
  nd_meili_data:
  nd_seaweed_data:
  nd_pgvector_data:
  nd_prom_data:
  nd_grafana_data:
