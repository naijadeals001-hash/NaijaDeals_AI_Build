# NaijaDeals — protected external tester access (named Cloudflare Tunnel)
#
# STATUS: PREPARED ONLY. NOT ACTIVE.
#   No tunnel exists, no DNS record exists and this file has never been run.
#   Both blockers must clear before anything here is used; see README.md.
#
# Ingress contract (do not extend without an owner decision):
#   * exactly one public hostname -> the staging app on 127.0.0.1:3200
#   * every other hostname routed to this tunnel -> HTTP 404
#   * n8n (5680), PostgreSQL (55432) and the development previews
#     (3047 / 3107 / 3109) must never appear in this file
#
# Replace both placeholders after `cloudflared tunnel create`. The UUID is not
# a secret; the credentials JSON it points at is, and stays outside the repo
# (default location: C:\Users\<you>\.cloudflared\<UUID>.json).

tunnel: REPLACE_WITH_TUNNEL_UUID
credentials-file: C:\Users\User\.cloudflared\REPLACE_WITH_TUNNEL_UUID.json

# Local metrics/diagnostics only, on loopback.
metrics: 127.0.0.1:49312

# Do not let the binary upgrade itself under a running service.
no-autoupdate: true
protocol: quic

ingress:
  - hostname: staging-remote.naijadeals.com
    service: http://127.0.0.1:3200
    originRequest:
      connectTimeout: 30s
      noTLSVerify: false
      httpHostHeader: staging-remote.naijadeals.com

  # Catch-all: refuse anything that is not the hostname above.
  # Must stay last. Never replace with http_status:200 or a wildcard.
  - service: http_status:404
